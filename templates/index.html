<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visa & WLB Job Tracker</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #38bdf8;
            --border-color: #334155;
            --badge-green: #22c55e;
            --badge-amber: #f59e0b;
            --tech-tag-bg: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 1000px;
            width: 100%;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.25rem;
            margin-bottom: 0.5rem;
            color: var(--accent-color);
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }

        .filter-panel {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.25rem;
            margin-bottom: 2rem;
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
            align-items: center;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
        }

        .filter-group label {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.6rem 1rem;
            border-radius: 6px;
            font-size: 0.95rem;
            outline: none;
            cursor: pointer;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            cursor: pointer;
            margin-top: auto;
            margin-bottom: 0.2rem;
        }

        .checkbox-group input {
            width: 1.1rem;
            height: 1.1rem;
            accent-color: var(--accent-color);
            cursor: pointer;
        }

        .stats-bar {
            margin-bottom: 1rem;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .job-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .job-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 1.25rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.1s ease, border-color 0.1s ease;
        }

        .job-card:hover {
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .job-info h3 {
            margin: 0 0 0.35rem 0;
            font-size: 1.15rem;
        }

        .company-name {
            color: var(--accent-color);
            font-weight: 600;
        }

        .job-meta {
            display: flex;
            gap: 0.75rem;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            align-items: center;
        }

        .tech-stack {
            margin-top: 0.6rem;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .tech-tag {
            background: var(--tech-tag-bg);
            color: var(--text-color);
            padding: 2px 7px;
            border-radius: 4px;
            margin-right: 4px;
            font-size: 0.75rem;
            display: inline-block;
            margin-top: 4px;
        }

        .badge {
            padding: 0.25rem 0.6rem;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
        }

        .badge-visa {
            background-color: rgba(34, 197, 94, 0.15);
            color: var(--badge-green);
            border: 1px solid rgba(34, 197, 94, 0.3);
        }

        .badge-level {
            background-color: rgba(245, 158, 11, 0.15);
            color: var(--badge-amber);
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .apply-btn {
            background-color: var(--accent-color);
            color: #0f172a;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 0.9rem;
            transition: opacity 0.2s ease;
            white-space: nowrap;
        }

        .apply-btn:hover {
            opacity: 0.9;
        }

        .empty-state {
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Visa & WLB Job Tracker</h1>
        <p class="subtitle">Filtered tech opportunities with confirmed visa support and tech stack extraction.</p>
    </header>

    <div class="filter-panel">
        <div class="filter-group">
            <label for="regionSelect">Region</label>
            <select id="regionSelect" onchange="fetchJobs()">
                <option value="all">All Regions</option>
                <option value="global">Global / Outside India</option>
                <option value="india">India</option>
            </select>
        </div>

        <div class="filter-group">
            <label for="levelSelect">Role Level</label>
            <select id="levelSelect" onchange="fetchJobs()">
                <option value="all">All Levels</option>
                <option value="sde1">SDE-1 / Entry</option>
                <option value="sde2">SDE-2 / Mid</option>
            </select>
        </div>

        <label class="checkbox-group">
            <input type="checkbox" id="visaToggle" onchange="fetchJobs()">
            <span>Strict Visa / Relocation Only</span>
        </label>

        <label class="checkbox-group">
            <input type="checkbox" id="preferredOnlyToggle" onchange="fetchJobs()">
            <span><b>Preferred Companies</b></span>
        </label>
    </div>

    <div class="stats-bar" id="statsBar">Loading jobs...</div>

    <div class="job-grid" id="jobGrid"></div>
</div>

<script>
    function fetchJobs() {
        const region = document.getElementById('regionSelect').value;
        const level = document.getElementById('levelSelect').value;
        const visaOnly = document.getElementById('visaToggle').checked;
        const preferredOnly = document.getElementById('preferredOnlyToggle').checked;

        const url = `/api/jobs?region=${region}&level=${level}&visa_only=${visaOnly}&preferred_only=${preferredOnly}`;

        document.getElementById('statsBar').innerText = 'Updating jobs...';

        fetch(url)
            .then(response => response.json())
            .then(jobs => renderJobs(jobs))
            .catch(err => {
                console.error('Error fetching jobs:', err);
                document.getElementById('statsBar').innerText = 'Failed to load jobs.';
            });
    }

    function renderJobs(jobs) {
        const grid = document.getElementById('jobGrid');
        const stats = document.getElementById('statsBar');

        stats.innerText = `Showing ${jobs.length} roles matching your criteria`;
        grid.innerHTML = '';

        if (jobs.length === 0) {
            grid.innerHTML = `<div class="empty-state">No matching roles found. Try adjusting your filters.</div>`;
            return;
        }

        jobs.forEach(job => {
            const card = document.createElement('div');
            card.className = 'job-card';

            const visaBadge = job.visa_sponsored && job.visa_sponsored.toLowerCase().startsWith('yes')
                ? `<span class="badge badge-visa">Visa Supported</span>` 
                : '';

            const levelBadge = job.role_level 
                ? `<span class="badge badge-level">${job.role_level}</span>` 
                : '';

            const techStack = job.requirements 
                ? job.requirements.split(', ').map(t => `<span class="tech-tag">${t}</span>`).join('') 
                : '';

            const targetUrl = (job.apply_link && job.apply_link !== '#') ? job.apply_link : '#';

            card.innerHTML = `
                <div class="job-info">
                    <h3>${job.title}</h3>
                    <div><span class="company-name">${job.company}</span> • ${job.location || 'Remote / Unspecified'}</div>
                    <div class="job-meta">
                        ${levelBadge}
                        ${visaBadge}
                    </div>
                    <div class="tech-stack">
                        <strong>Tech:</strong> ${techStack}
                    </div>
                </div>
                <div>
                    <a href="${targetUrl}" target="_blank" rel="noopener noreferrer" class="apply-btn">Apply Now</a>
                </div>
            `;
            grid.appendChild(card);
        });
    }

    document.addEventListener('DOMContentLoaded', fetchJobs);
</script>

</body>
</html>
